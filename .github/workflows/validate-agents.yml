name: Validate Agent Definitions

# Applique les conventions des fiches d'agents (<workflow>/agents/*.md) :
# front-matter, disallowedTools: Task, tier, pas de model/allowedTools (ADR-0008, ADR-0019).

on:
  push:
    branches: [main]
    paths:
      - "*/agents/**"
      - "scripts/validate_agents.py"
      - ".github/workflows/validate-agents.yml"
  pull_request:
    paths:
      - "*/agents/**"
      - "scripts/validate_agents.py"
      - ".github/workflows/validate-agents.yml"
  workflow_dispatch:

jobs:
  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Validate agent definitions
        run: python3 scripts/validate_agents.py
